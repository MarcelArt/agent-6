name: agent-6

services:
  agent-6:
    container_name: agent-6
    image: marcelaritonang/agent-6:latest
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      SERVER_SHUTDOWN_TIMEOUT: 110
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - agent6-data:/data
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  agent6-data:
